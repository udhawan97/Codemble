name: Early-tester report
description: Report a first-run outcome, including failed or assisted trials, without private code.
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Follow the [tester guide](https://github.com/udhawan97/Codemble/blob/main/TESTING.md); "these test steps" below refers to that guide.
        Reports are public and associated with your GitHub handle; no real name is needed.
        Do not paste source, paths, private project or repository identities, credentials, or API keys.
        Quote your confusion in your own words—the rough edges are the evidence we need.
  - type: input
    id: version
    attributes:
      label: Codemble version
      description: Use the same installation as the trial. Run `codemble --version` or `uvx codemble --version` for that install route. If installation failed, say so.
      placeholder: Paste the version output, or say installation failed.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install route
      options:
        - uvx codemble (recommended)
        - pipx install codemble
        - pip install codemble
        - source checkout
        - other (describe below)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: What is your project written in?
      options:
        - Python
        - JavaScript
        - TypeScript
        - A mix
        - Not sure / did not select a project
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Give your OS and browser; if you did not reach the browser, say so.
      placeholder: macOS / Linux / Windows, Python version, browser
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: Launch choice
      description: Which route did you start with?
      options:
        - Explore freely
        - Take a first flight
        - Launch choice was not shown
        - Did not reach the launch choice
    validations:
      required: true
  - type: dropdown
    id: register
    attributes:
      label: Explanation depth
      description: The launch choices become Easy / Expert in the persistent control.
      options:
        - New to coding? (Easy)
        - I build software (Expert)
        - Switched between Easy and Expert
        - Not sure / did not reach the app
    validations:
      required: true
  - type: dropdown
    id: assistance
    attributes:
      label: What help did you use?
      options:
        - Only the app and these test steps
        - Extra documentation or hints
        - Help from a person or AI
        - More than one kind of outside help
    validations:
      required: true
  - type: dropdown
    id: project_size
    attributes:
      label: Approximate supported source-file count (optional)
      description: A rough range is enough; do not include your project name or path.
      options:
        - 1–100
        - 101–1,000
        - 1,001–5,000
        - More than 5,000
        - Not sure / did not select a project
  - type: textarea
    id: confusion
    attributes:
      label: First confusing moment, verbatim
      description: What did you expect, and what did you see instead? "No confusing moment" or "Did not reach the app" are valid answers.
    validations:
      required: true
  - type: dropdown
    id: lit
    attributes:
      label: Did you light one system by passing its checks?
      description: Record illumination separately from the help you used above.
      options:
        - "Yes"
        - "No"
        - Did not reach the checks
    validations:
      required: true
  - type: dropdown
    id: restart
    attributes:
      label: Did the system stay lit after restarting Codemble and reopening the same project?
      options:
        - "Yes"
        - "No"
        - Could not test restart persistence
        - Did not light a system
    validations:
      required: true
  - type: textarea
    id: correctness
    attributes:
      label: Anything structurally or educationally wrong?
      description: Use a safe synthetic description; never paste private source, identifiers, paths, or keys.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private code, paths, project or repository identities, credentials, and API keys.
          required: true
