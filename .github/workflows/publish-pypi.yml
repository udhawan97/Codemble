name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep this aligned with ci.yml and pages.yml, which have been green with the
      # identical `python-version: "3.11"` input. This workflow was the only
      # one still on v5 -- the release path missed a sweep the others got.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set reproducible build timestamp
        run: |
          release_epoch=$(node -p "require('./docs-site/release.json').sourceDateEpoch")
          echo "SOURCE_DATE_EPOCH=$release_epoch" >> "$GITHUB_ENV"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Verify the wheel carries the packaged SPA
        run: python -c 'import pathlib, zipfile; wheel = next(pathlib.Path("dist").glob("*.whl")); names = zipfile.ZipFile(wheel).namelist(); assert "codemble/web_dist/index.html" in names; assert any(name.startswith("codemble/web_dist/assets/") for name in names)'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Verify release manifest against built artifacts
        run: node docs-site/scripts/check-release-facts.mjs --dist dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  mirror-and-verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Build checksum ledger
        run: |
          cd dist
          sha256sum codemble-*.whl codemble-*.tar.gz > SHA256SUMS.txt
      - name: Attach exact artifacts and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/codemble-*.whl dist/codemble-*.tar.gz dist/SHA256SUMS.txt --clobber
      - name: Verify published release from the outside
        run: |
          for attempt in $(seq 1 12); do
            node docs-site/scripts/check-release-facts.mjs --live && exit 0
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
