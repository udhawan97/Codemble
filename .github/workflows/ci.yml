name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: astro check
        run: |
          cd docs-site
          npm install
          npm run check
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build web app
        run: |
          cd web
          npm install
          npm run check
      # `npm run check` builds into codemble/web_dist, which is committed and
      # shipped inside the wheel. The build is reproducible, so anything the
      # rebuild changed means the committed bundle was never refreshed and
      # users would install a stale app.
      - name: committed SPA bundle is current
        run: |
          if [ -n "$(git status --porcelain -- codemble/web_dist)" ]; then
            echo "::error::codemble/web_dist is stale. Run 'cd web && npm run build' and commit the result."
            git status --short -- codemble/web_dist
            exit 1
          fi
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and verify packaged SPA
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/codemble-wheel
          python -c 'import pathlib, zipfile; wheel = next(pathlib.Path("/tmp/codemble-wheel").glob("*.whl")); names = zipfile.ZipFile(wheel).namelist(); assert "codemble/web_dist/index.html" in names; assert any(name.startswith("codemble/web_dist/assets/") for name in names)'
