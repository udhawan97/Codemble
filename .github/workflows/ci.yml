name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: astro check
        run: |
          cd docs-site
          npm install
          npm run check
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build web app
        run: |
          cd web
          npm install
          npm run check
      # `npm run check` builds into codemble/web_dist, which is committed and
      # shipped inside the wheel. The build is reproducible, so anything the
      # rebuild changed means the committed bundle was never refreshed and
      # users would install a stale app.
      - name: committed SPA bundle is current
        run: |
          if [ -n "$(git status --porcelain -- codemble/web_dist)" ]; then
            echo "::error::codemble/web_dist is stale. Run 'cd web && npm run build' and commit the result."
            git status --short -- codemble/web_dist
            exit 1
          fi
  # styles.css is 3,216 lines across 17 media blocks and carries the product's
  # entire layout contract. Three of the last eight bugfixes were exactly that,
  # and none could be caught by any JS seam -- 99b6875 was a bug in cascade
  # resolution, visible only to a browser. Its own job because, unlike
  # web-check, it needs a running Codemble.
  space-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -e ".[dev]"
          cd web && npm install
      # The committed bundle, served against this repository -- the same app a
      # learner installs, not a fixture that can drift from it.
      - name: Serve the app
        run: |
          CODEMBLE_DATA_DIR=/tmp/codemble-ci python -m codemble.cli . --port 8899 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8899/ && break
            sleep 2
          done
      - name: Shell space budget
        run: |
          cd web
          npx --yes playwright install --with-deps chromium
          CODEMBLE_URL=http://127.0.0.1:8899 npm run check:space
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and verify packaged SPA
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/codemble-wheel
          python -c 'import pathlib, zipfile; wheel = next(pathlib.Path("/tmp/codemble-wheel").glob("*.whl")); names = zipfile.ZipFile(wheel).namelist(); assert "codemble/web_dist/index.html" in names; assert any(name.startswith("codemble/web_dist/assets/") for name in names)'
