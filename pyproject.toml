[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "codemble"
version = "0.21.1"
description = "A learning game that turns the code AI wrote for you into a galaxy you light up by understanding it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Umang Dhawan", email = "umangdhawan97@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Environment :: Web Environment",
  "Topic :: Software Development :: Documentation",
  "Topic :: Education",
]
dependencies = [
  # Direct, not transitive, and the floor is load-bearing. Narration runs on
  # `anyio.to_thread.run_sync(..., abandon_on_cancel=True)`, and that keyword
  # was named `cancellable` until anyio 4.1 -- so on any older resolution every
  # /explanation request raises TypeError before it reaches a single `except`.
  # Codemble only ever received anyio through Starlette, whose own constraint
  # is `anyio>=3.6.2,<5` and therefore permits exactly that.
  "anyio>=4.1",
  "fastapi>=0.115",
  # Hard upper bound, not caution, and re-verified against every shipped
  # grammars now shipped. tree-sitter 0.26.0 SIGSEGVs (exit 139) inside the
  # JS/TS adapter; 0.25.2 parses the same tree cleanly.
  #
  # The re-test narrowed it twice over the original note, so both corrections
  # are recorded here rather than left to be rediscovered:
  #   * It is the JAVASCRIPT grammar. Parsing only `.ts` is clean, as are Go,
  #     Java, Rust, C#, Ruby, PHP and Python. `.js`/`.jsx` crashes every run (3/3).
  #   * It does NOT need "a corpus of real size". 23 files reproduce it. What
  #     the old note got right is that a bare traversal will not: walking
  #     188,755 named nodes across all six grammars on 0.26.0 is clean, and
  #     only the adapter's own query/cursor work trips it.
  # Raise this only once a grammar release is verified against the newer core.
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
  # The Phase 2 language slate. Each is capped the same way the JS/TS grammars
  # are: a grammar release is only safe once it has been run against the pinned
  # core on a project of real size, and the segfault that produced that rule
  # only ever showed up at scale.
  "tree-sitter-go>=0.23,<0.24",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-rust>=0.23,<0.24",
  "tree-sitter-c-sharp>=0.23,<0.24",
  # Official upstream grammars, each tested against tree-sitter 0.25.2 before
  # entering the default registry. Keep the grammar minors bounded until their
  # next releases pass the parser-evidence oracle and realistic scale corpus.
  "tree-sitter-ruby>=0.23,<0.24",
  "tree-sitter-php>=0.24,<0.25",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  # Bounded on purpose. No `select` is configured, so the gate is ruff's
  # default rule set -- which each minor release redefines. An open range
  # therefore changes what CI enforces by calendar date rather than by a
  # reviewed change. Raise this deliberately, with the findings triaged.
  "ruff>=0.16,<0.17",
  "httpx>=0.27",
]

[project.scripts]
codemble = "codemble.cli:main"

[project.urls]
Homepage = "https://udhawan97.github.io/Codemble/"
Repository = "https://github.com/udhawan97/Codemble"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests/fixtures"]

[tool.hatch.build.targets.wheel]
packages = ["codemble"]
include = ["codemble/web_dist/**"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".remember",
  ".hallmark",
  ".claude",
  ".superpowers",
  # Developer-owned backup/runtime markers can exist in a working tree but
  # must never become published source-archive payload.
  ".git-backup-remote",
  ".last-git-backup-ts",
  ".playwright-cli",
  # `uv run --with build` creates this developer lockfile before invoking the
  # build backend. Clean CI builds do not. Excluding it keeps the sdist a
  # function of tracked release source rather than the caller's launcher.
  "uv.lock",
  # These files are deliberately generated/ignored by the parser fixture. Hatch
  # otherwise includes them when a developer builds from an exercised worktree,
  # making that sdist differ from the same commit built in a clean checkout.
  "tests/fixtures/sampleproj/generated",
  "tests/fixtures/sampleproj/ignored.py",
  # The public site has its own Pages artifact. Keeping it out of the Python
  # source archive also lets release.json record the archive's own digest
  # without creating a self-referential build.
  "docs-site",
  "web/node_modules",
]
