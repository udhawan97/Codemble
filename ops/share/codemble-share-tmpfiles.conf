# Root owns the stable pathnames; the writer owns only its provisioned stores.
d /var/lib/codemble/share 0750 root codemble-share -
d /var/lib/codemble/share/active 0700 codemble-share codemble-share -
d /var/lib/codemble/share/retirement-journal 0700 codemble-share codemble-share -
d /var/lib/codemble/share/backup-staging 0700 codemble-share codemble-share -
f /var/lib/codemble/share/.active.share-operations.lock 0660 root codemble-share -
