# Root owns the alert spool and stable relay lock on every monitored node.
d /var/lib/codemble/share-alerts 0700 root root -
d /var/lib/codemble/share-alerts/pending 0700 root root -
d /var/lib/codemble/share-alerts/delivered 0700 root root -
f /var/lib/codemble/share-alerts/.relay.lock 0600 root root -
